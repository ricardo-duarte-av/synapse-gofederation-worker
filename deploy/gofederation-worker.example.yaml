# gofederation-worker configuration.
#
# Copy to gofederation-worker.yaml next to docker-compose.yaml. The paths below
# are the ones INSIDE the container, as mounted by that compose file.
#
# Anything derivable from Synapse's own config is not repeated here:
# server_name, the federation sender list, the signing key path, Redis and the
# retry tuning are read from homeserver.yaml at every start. That is deliberate
# -- federation_sender_instances is not a value we consume but the value that
# DEFINES which destinations are ours, since the shard is
# sha256(destination) mod len(instances). A stale copy would not fail; it would
# silently reassign every destination on the server.
#
# Unknown keys are a startup error, so a typo is reported rather than ignored.

# This process's own identity on the replication bus, and the key its cursors
# are stored under. It must NOT be one of homeserver.yaml's
# federation_sender_instances -- startup refuses that.
#
# Not the same as shadow.instance below, and the difference is not cosmetic:
# the bus suppresses a worker's own echo by instance name, so a shadow calling
# itself by the name of the sender it shadows would discard that sender's rows
# and process nothing at all, while looking perfectly healthy.
worker_name: av-gofederation-worker-1

# Synapse's homeserver.yaml, mounted read-only.
synapse_config: /etc/synapse/homeserver.yaml

# homeserver.yaml's signing_key_path names a path inside SYNAPSE's container
# (/data/aguiarvieira.pt.signing.key). This worker mounts the same file
# elsewhere, so it says where.
signing_key_path: /data/signing.key

shadow:
  # true = dry-run. The full pipeline runs -- destinations resolved, shard
  # applied, transaction assembled and SIGNED -- and is then logged instead of
  # sent. Nothing is written to any Synapse table, nothing is published to
  # Redis. Defaults to true if omitted.
  #
  # With enabled: false you MUST also set exactly one of send_only_to or
  # send_to_all below; startup is refused otherwise, because it must never be
  # unclear whether this process is putting traffic on the internet.
  # See docs/going-live.md.
  enabled: true

  # The federation sender whose SHARD we take -- which destinations are ours.
  # Must be one of homeserver.yaml's federation_sender_instances. While
  # shadowing this is an EXISTING sender, so our decisions are directly
  # comparable with that container's.
  instance: av-federation-sender-worker-1

  # The persisted comparison record. These counters survive restarts because
  # the promotion gate is measured in weeks, not in one afternoon's uptime.
  difflog_dir: /data/difflog

  # Record complete transactions for these destinations, so they can be
  # compared byte for byte against what Synapse actually sent to the same
  # server. The other half is written by fedrecorder; cmd/fedcompare diffs them.
  #
  # Meant for ONE low-volume test destination we control. Pointing this at a
  # real busy server writes every transaction to it to disk -- a lot of disk,
  # and a lot of other people's message content.
  #
  # The name matters: it must hash into the shard named by shadow.instance
  # above, or the worker produces nothing for it and the capture stays empty.
  capture_destinations: [testing.aguiarvieira.pt]
  capture_file: /data/captures/worker.jsonl

  # The send allowlist: destinations this worker REALLY sends to. Everything
  # else stays dry-run even when enabled is false, which is how going live
  # happens one server at a time.
  #
  # An empty list sends to NOBODY. It is never read as "everyone".
  # send_only_to: [testing.aguiarvieira.pt]

  # Send to every destination in this worker's shard. The end state, and a
  # separate option on purpose: nobody should reach production federation
  # traffic by deleting a line. Cannot be combined with send_only_to.
  # send_to_all: false

database:
  # Synapse's database, read-only. libpq keyword form, not a URI.
  # host=/var/sockets is the direct unix socket with peer auth as uid 991; the
  # Go workers deliberately bypass the pgcat pooler homeserver.yaml uses.
  dsn: "host=/var/sockets user=gofed_ro dbname=synapse-db"
  max_conns: 16
  connect_timeout_seconds: 10
  # Refuse to start if the role can write to Synapse's tables. Off by default
  # so a scratch database works for development; ON in production, because
  # three of the tables this reads are consumed by the real senders.
  require_read_only: true

state:
  # Our own cursors and routing record -- the only things this worker writes
  # anywhere. A separate role with access to one schema. See
  # deploy/state-role.sql.
  dsn: "host=/var/sockets user=gofed_state dbname=synapse-db"
  table: gofederation.stream_positions
  # Our copy of Synapse's destination_rooms, which the routing comparison
  # joins against. See docs/verification.md.
  routes_table: gofederation.destination_rooms

replication:
  enabled: true
  # Omit to use homeserver.yaml's redis block, which is the normal case.
  # address: /var/sockets/keydb
  # The channel is named after server_name and there is no prefix setting in
  # Synapse. Only override it against a scratch bus.
  # channel: aguiarvieira.pt

queue:
  # One goroutine per destination is the point of this worker; this only stops
  # unbounded from being a way to fall over.
  max_concurrent_destinations: 2000
  # Synapse's own limits. Do not change these while shadowing -- a different
  # batch size produces different transactions and the comparison stops
  # meaning anything.
  max_pdus_per_transaction: 50
  max_edus_per_transaction: 100
  event_batch_limit: 100

  # Namespaces our transaction ids away from Synapse's own senders'.
  #
  # A receiving Synapse deduplicates on (origin, transaction_id) and returns
  # the cached response for a repeat, so if this worker and one of Synapse's
  # senders ever pick the same id for the same destination, the second
  # transaction's events are silently discarded. Both seed from
  # milliseconds-since-epoch and increment, so their ranges drift into each
  # other.
  #
  # Defaults to "gofed-". Only set it empty once no other sender delivers to
  # any destination this worker handles.
  # transaction_id_prefix: "gofed-"

metrics:
  # 9099 is Synapse main, 9101 the Python workers, 9200 gopro, 9201 gosync.
  addr: ":9202"

log:
  level: info
  pretty: false
