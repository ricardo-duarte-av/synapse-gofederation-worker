# The recording proxy, in front of the test homeserver.
#
# It joins the same external networks as everything else so nginx-proxy-manager
# can reach it by container name, and so it can reach testing-synapse by name.
#
# Deploy alongside the test Synapse, e.g.
# /opt/matrix/synapse-testing/docker-compose.yaml, or as its own project.

services:
  fedrecorder:
    image: ghcr.io/ricardo-duarte-av/synapse-gofederation-worker/fedrecorder:latest
    container_name: av-fedrecorder
    restart: unless-stopped

    command:
      - -listen=:8449
      # Reached by container name on the shared network.
      - -upstream=http://testing-synapse:8008
      - -out=/data/captures/synapse.jsonl
      # Record only traffic from the server we are comparing against. The
      # origin is read from the transaction body, which is what was signed,
      # not from the Authorization header, which is not.
      - -origin=aguiarvieira.pt

    volumes:
      # The captures must outlive the container: they are the ground-truth half
      # of the comparison and are read long after they are written.
      - ./captures:/data/captures

    networks:
      - npm-nw
      - npm-nw6

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  npm-nw:
    external: true
  npm-nw6:
    external: true
