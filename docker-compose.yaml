# Both halves of the shadow rig.
#
# They are in one file because they run on one host, but they belong to two
# different places and it is worth knowing which is which:
#
#   gofederation-worker  reads the MAIN Synapse's database, KeyDB and config.
#                        It is logically part of that deployment.
#   fedrecorder          sits in front of the TEST homeserver and records what
#                        the main Synapse actually sends to it.
#
# Split them into separate compose projects if they ever move apart. Nothing
# here depends on them sharing a file.
#
# See docs/test-destination.md for the NPM routing, and docs/going-live.md
# before changing shadow.enabled.

services:
  # ---------------------------------------------------------------- worker --
  gofederation-worker:
    image: ghcr.io/ricardo-duarte-av/synapse-gofederation-worker:latest
    container_name: av-gofederation-worker-1
    restart: unless-stopped

    # Synapse's uid. Needed for peer authentication on the PostgreSQL unix
    # socket and to read the shared socket directory.
    user: "991:991"

    volumes:
      - ./gofederation-worker.yaml:/data/gofederation-worker.yaml:ro
      # Synapse's whole data directory, READ-ONLY. It is the source of truth for
      # server_name, the federation sender list, the database, Redis and the
      # retry tuning, and federation_sender_instances in particular DEFINES
      # which destinations are ours, so a stale copy would silently reshard us.
      #
      # The directory rather than homeserver.yaml alone, because the private
      # signing key lives in it and homeserver.yaml is what says so. Unlike the
      # read-only workers, a federation SENDER needs that key: transactions are
      # signed even in shadow mode, so a signature over the wrong bytes is
      # caught now rather than on the day this goes live. signing_key_path names
      # /data/aguiarvieira.pt.signing.key -- the path inside SYNAPSE's container
      # -- and the worker falls back to the same basename beside the
      # homeserver.yaml it read, which is here.
      #
      # :ro is the whole point of the line. Nothing in this directory is ever
      # written by this worker, and the key in particular must not be.
      - /opt/matrix/synapse/synapse:/etc/synapse:ro
      # PostgreSQL and KeyDB sockets.
      - /var/sockets:/var/sockets
      # These MUST outlive the container. The difflog is the promotion record,
      # measured in weeks; the captures are half of the byte-level comparison
      # and are read long after they are written.
      #
      # Owned by uid 991 here, matching the user: line above:
      #     mkdir -p difflog captures && chown 991:991 difflog captures
      - ./difflog:/data/difflog
      - ./captures:/data/captures

    networks: [npm-nw, npm-nw6]

    # Distroless, so there is no curl; the binary probes itself.
    healthcheck:
      test: ["CMD", "/gofederation-worker", "-healthcheck", "-config", "/data/gofederation-worker.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "5"}

  # -------------------------------------------------------------- recorder --
  fedrecorder:
    image: ghcr.io/ricardo-duarte-av/synapse-gofederation-worker/fedrecorder:latest
    container_name: av-fedrecorder
    restart: unless-stopped

    command:
      - -listen=:8449
      # The TEST homeserver, by container name on the shared network.
      - -upstream=http://testing-synapse:8008
      - -out=/data/captures/synapse.jsonl
      # Record only traffic from the server being compared against. The origin
      # is read from the transaction BODY, which is what was signed, not from
      # the Authorization header, which is not.
      - -origin=aguiarvieira.pt

    volumes:
      # Written by the recorder, read by fedcompare. Same directory the worker
      # writes its own half into, so the two files sit side by side.
      #
      # The image is distroless nonroot, so this runs as uid 65532 and the
      # directory must be writable by it. Create it before the first start:
      #
      #     mkdir -p captures && chown 65532:65532 captures
      #
      # Otherwise the recorder exits at startup with a permission error --
      # deliberately, since a recorder that is not recording is useless and
      # silently so, and a deploy is when you want to find that out.
      - ./captures:/data/captures

    networks: [npm-nw, npm-nw6]

    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "5"}

networks:
  npm-nw:
    external: true
  npm-nw6:
    external: true
